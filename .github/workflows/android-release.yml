name: Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Signed APK and release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nay-planos-release.keystore"

      - name: Assemble signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nay-planos-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          RELEASE_VERSION="$version" RELEASE_VERSION_CODE="$version_code" ./gradlew assembleRelease --no-daemon

      - name: Create checksum and release manifest
        env:
          SIGNING_CERTIFICATE_SHA256: ${{ secrets.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_CERTIFICATE_SHA256"
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_BASE64"
          version="${GITHUB_REF_NAME#v}"
          generated_apk="app/build/outputs/apk/release/app-release.apk"
          apk="app/build/outputs/apk/release/nay-planos-$version.apk"
          test -f "$generated_apk"
          mv "$generated_apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/update-signing-private.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-signing-private.pem" -out "$apk.sig" "$apk"
          rm -f "$RUNNER_TEMP/update-signing-private.pem"
          checksum="$(cut -d ' ' -f 1 "$apk.sha256")"
          checksum_note="SHA256[$(basename "$apk")]=$checksum"
          jq -n \
            --arg version "$version" \
            --arg packageName "br.com.eibragaa.nayplanos" \
            --arg assetName "$(basename "$apk")" \
            --arg signatureAssetName "$(basename "$apk.sig")" \
            --arg sha256 "$checksum" \
            --arg certificate "$SIGNING_CERTIFICATE_SHA256" \
            '{schemaVersion:1,version:$version,packageName:$packageName,assetName:$assetName,signatureAssetName:$signatureAssetName,sha256:$sha256,signingCertificateSha256:$certificate}' \
            > app/build/outputs/apk/release/release-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="app/build/outputs/apk/release/nay-planos-$version.apk"
          checksum_note="SHA256[$(basename "$apk")]=$(cut -d ' ' -f 1 "$apk.sha256")"
          gh release create "$GITHUB_REF_NAME" \
            --title "Nay Planos $GITHUB_REF_NAME" \
            --notes "$checksum_note" \
            "$apk" \
            "$apk.sha256" \
            "$apk.sig" \
            app/build/outputs/apk/release/release-manifest.json
